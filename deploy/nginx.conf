# Employee Connect edge proxy (nginxinc/nginx-unprivileged: listens 8080/8443, published as 80/443 by compose).
# This file is a TEMPLATE mounted at /etc/nginx/nginx.conf.tpl. scripts/nginx-start.sh replaces @@PUBLIC_HOSTNAME@@ and
# @@PUBLIC_ORIGIN@@ and writes /tmp/nginx.conf (plus /tmp/ec-*.conf includes), which is what nginx actually runs.
# Certificates: /etc/nginx/certs/{fullchain.pem,privkey.pem}. Static admin console: /srv/www/console (read-only mount).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # read-only root fs: temp paths live on tmpfs. Upload bodies (> client_body_buffer_size) are spooled to
    # /var/body_temp, a SEPARATE size-capped tmpfs (compose: nginx.tmpfs, 128m) so uploads cannot fill /tmp or the host.
    # Worst case = upload concurrency cap (limit_conn uploadsrv, below) x upload limit (12m) must stay below that size.
    client_body_temp_path /var/body_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # ---- logging (no query strings: they could carry tokens) ------------------------------------------------
    log_format main '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent '
                    'rt=$request_time rid=$req_id';
    access_log /dev/stdout main;

    # ---- request id: keep a well-formed client value, otherwise generate one (matches backend ^[A-Za-z0-9-]{8,64}$) --
    map $http_x_request_id $req_id {
        default                      $request_id;
        "~^[A-Za-z0-9-]{8,64}$"      $http_x_request_id;
    }

    # ---- rate-limit key: client IP; IPv6 clients are bucketed per /64 (uncompressed addresses only) ----------
    map $remote_addr $limit_key {
        "~^(?<net64>[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}):" $net64;
        default $remote_addr;
    }
    # Office staff behind one NAT share an IP, so the general per-IP zones stay HIGH (flood/abuse backstop). Mobile-data
    # clients each have their own IP. The PRIMARY brute-force defence is per employee in the app (LOGIN_RATE_EID + lockout,
    # Redis), which nginx cannot key on (the employee id is in the JSON body). Per-IP in the app: LOGIN_RATE_IP (default 300
    # per 10 min, same ballpark as the `login` zone). Tune both to head-count; see docs/DEPLOY.md.
    limit_req_zone $limit_key zone=login:10m   rate=300r/m;  # POST /api/auth/login (5 r/s per IP)
    limit_req_zone $limit_key zone=authapi:10m rate=600r/m;  # other /api/auth/* (refresh, forgot, change-password, web/*)
    limit_req_zone $limit_key zone=api:20m     rate=20r/s;   # everything else
    limit_req_zone $limit_key zone=upload:10m  rate=120r/m;  # POST /api/files, /api/me/profile/photo, /api/admin/company/logo (the app also caps per employee)
    limit_req_zone $limit_key zone=weblogin:5m rate=10r/m;   # POST /api/auth/web/login: strict, the console is Admin-only and internet-facing
    limit_req_zone $limit_key zone=public:10m  rate=120r/m;  # /api/public/* (unauthenticated: company name + logo, server-setup probe)
    limit_req_zone $limit_key zone=console:5m  rate=20r/s;   # /console/ static files (a Flutter web start loads ~15 files)
    limit_conn_zone $limit_key zone=perip:10m;
    limit_conn_zone $server_name zone=uploadsrv:1m;          # global cap on concurrent uploads (sizes the body tmpfs)
    limit_req_status  429;
    limit_conn_status 429;

    # ---- TLS ----------------------------------------------------------------------------------------------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:prime256v1:secp384r1;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    # OCSP stapling is not enabled: Let's Encrypt retired OCSP and internal / self-signed CAs have no responder.

    # ---- timeouts / sizes -----------------------------------------------------------------------------------------
    client_header_timeout 10s;
    client_body_timeout   30s;
    send_timeout          30s;
    keepalive_timeout     30s;
    client_max_body_size  256k;        # small default for every JSON endpoint; only the exact-match upload locations raise it
    client_body_buffer_size 16k;       # bigger bodies are spooled to /var/body_temp (capped tmpfs)
    large_client_header_buffers 4 8k;
    ignore_invalid_headers on;
    underscores_in_headers off;

    # Docker's embedded DNS, so nginx follows the api container across restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- :80 -------------------------------------------------------------------------------------------------
    # Unknown Host (IP scanners, other domains pointed at us): close the connection without a response.
    # Docker's healthcheck (Host 127.0.0.1) only gets /nginx-health.
    server {
        listen 8080 default_server;
        server_name _;

        location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
        location /               { return 444; }
    }

    server {
        listen 8080;
        server_name @@PUBLIC_HOSTNAME@@;

        # Let's Encrypt HTTP-01 (webroot, mounted read-only from deploy/acme). Only token files live there.
        location ^~ /.well-known/acme-challenge/ {
            root /srv/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 301 https://$host@@HTTPS_PORT_SUFFIX@@$request_uri; }   # ":<HTTPS_PORT>" unless 443
    }

    # ---- :443 (+ optional :8444 PROXY-protocol listener for the VPS relay, option D) -----------------------------------
    # Default server: any SNI other than PUBLIC_HOSTNAME is refused during the TLS handshake (no certificate is revealed,
    # nothing is proxied). A client that sends the right SNI but another Host header is closed by the 444 below.
    server {
        listen 8443 ssl default_server;
        include /tmp/ec-relay-reject.conf;          # empty unless RELAY_PEER_IP is set
        server_name _;
        ssl_reject_handshake on;
    }

    server {
        listen 8443 ssl;
        include /tmp/ec-relay-app.conf;             # empty unless RELAY_PEER_IP is set
        http2 on;
        server_name @@PUBLIC_HOSTNAME@@;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        if ($host != "@@PUBLIC_HOSTNAME@@") { return 444; }

        # Security headers: shared snippet + the API defaults. A location that adds its own header drops every inherited
        # one, so such locations re-include the snippet.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control             "no-store" always;

        limit_conn perip 40;

        # Proxy headers. X-Real-IP / X-Forwarded-For are OVERWRITTEN with the TCP peer, never appended, so a client
        # cannot spoof its address to the backend. The backend trusts them only from TRUSTED_PROXIES (= this container).
        # With the VPS relay (option D) $remote_addr is the real client taken from the PROXY protocol header, and only
        # for connections coming from RELAY_PEER_IP (set_real_ip_from in /tmp/ec-relay-app.conf).
        proxy_http_version 1.1;
        # Any location that sets its own proxy_set_header drops ALL inherited ones, so it must re-include this snippet.
        include /etc/nginx/snippets/proxy-headers.conf;
        # Cookies mean nothing to the API except on /api/auth/web/ (re-enabled in those locations only).
        proxy_set_header Cookie            "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_hide_header X-Powered-By;
        # the api sets these too; nginx re-adds them (add_header ... always), so hide the upstream copies (no duplicate headers)
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Request-ID;

        # ---- admin console (Flutter web build, static) -----------------------------------------------------------
        # Files come from deploy/console/ (mounted read-only at /srv/www/console). Strict CSP, no CDN.
        # Optional allow-list: CONSOLE_ALLOW_CIDRS (empty = everyone who can reach the host).
        location = /console { return 301 /console/; }
        location /console/ {
            include /tmp/ec-console-allow.conf;
            limit_except GET { deny all; }
            limit_req zone=console burst=80 nodelay;
            root /srv/www;
            index index.html;
            try_files $uri $uri/ /console/index.html;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
            # Flutter build files keep their names between releases: always revalidate (ETag), never serve a stale shell.
            add_header Cache-Control "no-cache" always;
        }

        # ---- auth ------------------------------------------------------------------------------------------------
        # login: exact match; per-IP backstop only (per-employee limits in the app are the primary control)
        location = /api/auth/login {
            limit_req zone=login burst=100 nodelay;
            client_max_body_size 8k;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }

        # Console (browser) auth. The refresh token lives in the HttpOnly cookie __Secure-ec_rt (Path=/api/auth/web), so
        # the Cookie header is forwarded ONLY here. nginx also pins Origin to PUBLIC_ORIGIN (the backend checks it too,
        # plus X-EC-Client: console); browsers always send Origin on these POSTs. Same optional allow-list as /console/.
        location /api/auth/web/ {
            include /tmp/ec-console-allow.conf;
            if ($http_origin != "@@PUBLIC_ORIGIN@@") { return 403; }
            limit_req zone=authapi burst=20 nodelay;
            limit_conn perip 20;
            client_max_body_size 16k;
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_set_header Cookie $http_cookie;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }
        location = /api/auth/web/login {
            include /tmp/ec-console-allow.conf;
            if ($http_origin != "@@PUBLIC_ORIGIN@@") { return 403; }
            limit_req zone=weblogin burst=5 nodelay;
            client_max_body_size 8k;
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_set_header Cookie $http_cookie;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }

        # other auth endpoints (refresh, forgot password, change password)
        location /api/auth/ {
            limit_req zone=authapi burst=100 nodelay;
            client_max_body_size 16k;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }

        # ---- public (unauthenticated) company info -----------------------------------------------------------------
        # Logo: cacheable for a few minutes (the app re-fetches on logo_version change). The api re-encodes the image;
        # the sandbox CSP stops any active content should a browser ever render it.
        location = /api/public/company/logo {
            limit_except GET { deny all; }
            limit_req zone=public burst=30 nodelay;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Cache-Control "public, max-age=300" always;
        }
        location /api/public/ {
            limit_except GET { deny all; }
            limit_req zone=public burst=30 nodelay;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }

        # Upload routes (multipart). Exact matches so no other path can accept a large body:
        #   POST /api/files                       every purpose except profile_photo. 12m = MAX_UPLOAD_MB (10, backend) + multipart
        #                                         overhead: KEEP IN SYNC with MAX_UPLOAD_MB in .env.
        #   POST /api/me/profile/photo            the profile photo (backend cap 5 MB); 6m = 5 MB + multipart overhead.
        #   POST|DELETE /api/admin/company/logo   company logo (backend cap 2 MB); 3m = 2 MB + multipart overhead.
        # Add further exact-match locations like these if new upload routes appear.
        location = /api/files {
            limit_except POST { deny all; }
            limit_req zone=upload burst=20 nodelay;
            limit_conn uploadsrv 8;
            client_max_body_size 12m;
            client_body_buffer_size 16k;
            client_body_timeout 60s;
            proxy_request_buffering on;       # reject oversized/slow bodies at the edge, before the api sees them
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }

        location = /api/me/profile/photo {
            limit_except POST { deny all; }
            limit_req zone=upload burst=20 nodelay;
            limit_conn uploadsrv 8;
            client_max_body_size 6m;
            client_body_buffer_size 16k;
            client_body_timeout 60s;
            proxy_request_buffering on;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }

        location = /api/admin/company/logo {
            limit_except POST DELETE { deny all; }
            limit_req zone=upload burst=20 nodelay;
            limit_conn uploadsrv 8;
            client_max_body_size 3m;
            client_body_buffer_size 16k;
            client_body_timeout 60s;
            proxy_request_buffering on;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }

        # the rest of the API (JSON only): inherits the 256k body limit
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }

        # Everything else (/docs, /openapi.json, /healthz, ...) is not exposed.
        location / { return 404; }
    }
}
