# Common proxy headers. nginx inherits proxy_set_header from the enclosing level ONLY if the current level sets none,
# so every location that sets its own proxy_set_header (e.g. Cookie) MUST include this file first.
# X-Real-IP / X-Forwarded-For are OVERWRITTEN with the TCP peer, never appended, so a client cannot spoof its address.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $req_id;
proxy_set_header Forwarded         "";
proxy_set_header Connection        "";
