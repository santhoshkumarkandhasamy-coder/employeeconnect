# Shared security headers. nginx drops ALL inherited add_header directives as soon as a location declares its own,
# so every location that adds a header (CSP, Cache-Control, ...) must `include` this file again.
# Not here on purpose: Content-Security-Policy and Cache-Control (they differ per location).
add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options      "nosniff" always;
add_header X-Frame-Options             "DENY" always;
add_header Referrer-Policy             "no-referrer" always;
add_header Permissions-Policy          "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy  "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-Request-ID                $req_id always;
